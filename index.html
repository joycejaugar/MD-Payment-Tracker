<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Payment &amp; Tax Tracker</title>
<style>
  :root{
    --ink:#0F1B2B;
    --slate:#26364A;
    --slate-soft:#5A6B80;
    --paper:#F6F7F9;
    --panel:#FFFFFF;
    --line:#E2E6EB;
    --teal:#0E7C7B;
    --teal-dark:#0A5E5D;
    --teal-tint:#E6F3F2;
    --gold:#B9860B;
    --gold-tint:#FBF1DC;
    --red:#B3261E;
    --red-tint:#FBEAE9;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---------- Shell layout ---------- */
  .shell{
    display:grid;
    grid-template-columns:232px 1fr;
    min-height:100vh;
  }
  .sidebar{
    background:var(--ink);
    color:#fff;
    padding:24px 16px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .brand{
    padding:0 8px 20px 8px;
    border-bottom:1px solid rgba(255,255,255,0.12);
    margin-bottom:16px;
  }
  .brand .mark{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--teal);
    text-transform:uppercase;
  }
  .brand h1{
    font-size:17px;
    margin:6px 0 0 0;
    font-weight:650;
    line-height:1.25;
  }
  .navitem{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:13.5px;
    font-weight:500;
    color:rgba(255,255,255,0.72);
    transition:background .12s ease, color .12s ease;
    user-select:none;
  }
  .navitem:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .navitem.active{background:var(--teal); color:#fff;}
  .navitem .num{
    font-family:var(--mono);
    font-size:10.5px;
    opacity:.65;
    width:18px;
  }
  .sidebar-foot{
    margin-top:auto;
    padding:12px 8px 0 8px;
    border-top:1px solid rgba(255,255,255,0.12);
    font-size:11px;
    color:rgba(255,255,255,0.45);
    line-height:1.6;
  }

  .main{
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:14px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:20;
  }
  .topbar h2{
    font-size:19px;
    margin:0;
    font-weight:650;
  }
  .topbar .sub{
    font-size:12.5px;
    color:var(--slate-soft);
    margin-top:2px;
  }
  .topbar-controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .yearpicker{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--teal-tint);
    border:1px solid #BFE1DF;
    padding:6px 10px 6px 12px;
    border-radius:8px;
  }
  .yearpicker label{
    font-size:11px;
    font-weight:650;
    color:var(--teal-dark);
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .yearpicker select{
    border:none;
    background:transparent;
    font-family:var(--mono);
    font-size:14px;
    font-weight:600;
    color:var(--teal-dark);
    cursor:pointer;
  }

  button, .btn{
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    padding:8px 14px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--slate);
    cursor:pointer;
    transition:all .12s ease;
    white-space:nowrap;
  }
  button:hover{border-color:var(--slate-soft); }
  button.primary{
    background:var(--teal);
    border-color:var(--teal);
    color:#fff;
  }
  button.primary:hover{background:var(--teal-dark); border-color:var(--teal-dark);}
  button.ghost{background:transparent;border-color:transparent;color:var(--slate-soft);}
  button.ghost:hover{color:var(--ink); background:var(--paper);}
  button.danger{color:var(--red);}
  button.danger:hover{background:var(--red-tint); border-color:#E8B9B6;}
  button:disabled{opacity:.45; cursor:not-allowed;}
  button.small{padding:5px 10px; font-size:12px;}
  input[type=file]{display:none;}

  /* ---------- Content ---------- */
  .content{
    padding:26px 28px 60px 28px;
    flex:1;
  }
  .view{display:none;}
  .view.active{display:block;}

  .section-title{
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--slate-soft);
    margin:28px 0 12px 0;
  }
  .section-title:first-child{margin-top:0;}

  /* ---------- KPI cards ---------- */
  .kpi-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
  }
  @media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 16px 14px 16px;
    position:relative;
    overflow:hidden;
  }
  .kpi .bar{
    position:absolute; left:0; top:0; bottom:0; width:4px;
  }
  .kpi.stripe .bar{background:var(--teal);}
  .kpi.manual .bar{background:var(--gold);}
  .kpi.ooo .bar{background:#6B5CA5;}
  .kpi.refund .bar{background:var(--red);}
  .kpi.net .bar{background:var(--ink);}
  .kpi .label{
    font-size:11px;
    font-weight:650;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--slate-soft);
  }
  .kpi .value{
    font-family:var(--mono);
    font-size:24px;
    font-weight:600;
    margin-top:8px;
    color:var(--ink);
  }
  .kpi .meta{
    font-size:11.5px;
    color:var(--slate-soft);
    margin-top:5px;
  }

  /* ---------- Panels / Tables ---------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    gap:12px;
    flex-wrap:wrap;
  }
  .panel-head h3{margin:0; font-size:14.5px; font-weight:650;}
  .panel-head .hint{font-size:12px; color:var(--slate-soft); margin-top:2px;}
  .search{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:7px;
    padding:6px 10px;
    min-width:220px;
  }
  .search input{
    border:none;background:transparent;outline:none;font-size:13px;width:100%;
    font-family:var(--sans);
  }

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--slate-soft);
    font-weight:700;
    padding:10px 14px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    position:sticky; top:0;
    cursor:pointer;
    white-space:nowrap;
  }
  thead th.num, td.num{text-align:right;}
  thead th:hover{color:var(--ink);}
  tbody td{
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  tbody tr:hover{background:#FAFBFC;}
  tbody tr.total-row{background:var(--paper); font-weight:700;}
  tbody tr.total-row td{border-top:2px solid var(--slate);}
  td.mono, .mono{font-family:var(--mono);}
  td.neg, .neg{color:var(--red);}
  .table-scroll{max-height:560px; overflow:auto;}
  .empty-row td{
    text-align:center;
    color:var(--slate-soft);
    padding:40px 14px;
    font-style:italic;
  }
  .pill{
    display:inline-block;
    font-size:10.5px;
    font-weight:650;
    padding:3px 8px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .pill.stripe{background:var(--teal-tint); color:var(--teal-dark);}
  .pill.manual{background:var(--gold-tint); color:var(--gold);}
  .pill.ooo{background:#EFEBFA; color:#6B5CA5;}
  .pill.refund{background:var(--red-tint); color:var(--red);}
  .pill.notreceived{background:#EEE; color:#888;}

  /* ---------- Forms ---------- */
  .form-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    padding:18px;
  }
  @media(max-width:900px){.form-grid{grid-template-columns:repeat(2,1fr);}}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.span2{grid-column:span 2;}
  .field label{
    font-size:11.5px;
    font-weight:650;
    color:var(--slate-soft);
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .field input, .field select, .field textarea{
    font-family:var(--sans);
    font-size:13.5px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    background:#fff;
    color:var(--ink);
    outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--teal);
    box-shadow:0 0 0 3px var(--teal-tint);
  }
  .field textarea{resize:vertical; min-height:38px;}
  .form-actions{
    padding:0 18px 18px 18px;
    display:flex;
    gap:10px;
    align-items:center;
  }
  .form-msg{font-size:12.5px; color:var(--slate-soft);}
  .form-msg.err{color:var(--red);}
  .form-msg.ok{color:var(--teal-dark);}

  .row-actions{display:flex; gap:6px;}
  .row-actions button{padding:4px 8px; font-size:11.5px;}

  .banner{
    display:flex;
    gap:12px;
    align-items:flex-start;
    background:var(--gold-tint);
    border:1px solid #EBD8A6;
    color:#7A5A05;
    border-radius:10px;
    padding:12px 16px;
    font-size:12.5px;
    margin-bottom:20px;
    line-height:1.5;
  }
  .banner.hide{display:none;}
  .banner b{font-weight:700;}

  .toast{
    position:fixed;
    bottom:24px;
    right:28px;
    background:var(--ink);
    color:#fff;
    padding:12px 18px;
    border-radius:9px;
    font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
    opacity:0;
    transform:translateY(10px);
    transition:all .25s ease;
    pointer-events:none;
    z-index:100;
    max-width:340px;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,27,43,0.45);
    display:none; align-items:center; justify-content:center; z-index:90;
    padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:#fff; border-radius:12px; padding:22px; max-width:420px; width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  .modal h3{margin:0 0 8px 0; font-size:15px;}
  .modal p{margin:0 0 18px 0; font-size:13px; color:var(--slate-soft); line-height:1.5;}
  .modal .modal-actions{display:flex; justify-content:flex-end; gap:10px;}

  .footnote{
    font-size:11.5px;
    color:var(--slate-soft);
    padding:14px 18px;
    border-top:1px solid var(--line);
    background:var(--paper);
  }
</style>
</head>
<body>
<div class="shell">
  <div class="sidebar">
    <div class="brand">
      <div class="mark">Moxie &middot; MD Billing</div>
      <h1>Payment &amp; Tax Tracker</h1>
    </div>
    <div class="navitem active" data-view="summary"><span class="num">01</span> Summary</div>
    <div class="navitem" data-view="mdoverall"><span class="num">02</span> MD Overall Summary</div>
    <div class="navitem" data-view="permd"><span class="num">03</span> Per-MD &amp; PC Detail</div>
    <div class="navitem" data-view="manual"><span class="num">04</span> Manual Entries</div>
    <div class="navitem" data-view="stripelog"><span class="num">05</span> Stripe Payment Log</div>
    <div class="sidebar-foot" id="footStats">Loading data&hellip;</div>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h2 id="topTitle">Summary</h2>
        <div class="sub" id="topSub">Cash-basis totals for MD compensation and tax reporting</div>
      </div>
      <div class="topbar-controls">
        <div class="yearpicker">
          <label>Year</label>
          <select id="yearSelect"></select>
        </div>
        <button class="ghost small" id="btnExport">Export backup</button>
        <button class="ghost small" id="btnImportBackup">Restore backup</button>
        <input type="file" id="fileImportBackup" accept="application/json">
        <button class="primary" id="btnImportCsv">Import monthly CSV</button>
        <input type="file" id="fileImportCsv" accept=".csv">
      </div>
    </div>

    <div class="content">
      <div class="banner" id="importBanner"></div>
      <div id="views"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Delete entry?</h3>
    <p id="modalBody">This can't be undone.</p>
    <div class="modal-actions">
      <button class="ghost" id="modalCancel">Cancel</button>
      <button class="danger" id="modalConfirm">Delete</button>
    </div>
  </div>
</div>

<script>
/* ===================== MD Payment & Tax Tracker ===================== */
/* Storage keys */
const LS_STRIPE = 'mdtracker_stripe_v2';
const LS_MANUAL = 'mdtracker_manual_v2';
const LS_SEEDED = 'mdtracker_seeded_v2';
/* Old (v1) keys - checked once for migration so manual entries aren't lost */
const LS_STRIPE_OLD = 'mdtracker_stripe_v1';
const LS_MANUAL_OLD = 'mdtracker_manual_v1';
const LS_SEEDED_OLD = 'mdtracker_seeded_v1';

const MANUAL_TYPES = [
  'Manual Invoice',
  'OOO Payment - Interim MD',
  'OOO Payment - MD',
  'Refund / Wire Out'
];
const PAYMENT_METHODS = ['Wire', 'ACH', 'Check', 'Zelle', 'Other'];
const NO_PC = '(No PC on file)';

let STRIPE_ROWS = [];   // [{id, month, medspa, psm, md, pc, state, status, paidAt, fee, moxieFee, appFee, received}]
let MANUAL_ROWS = [];   // [{id, date, type, medspa, md, pc, amount, method, notes}]
let currentView = 'summary';
let currentYear = null;
let sortState = {}; // per-table sort memory

/* ---------------- Storage helpers ---------------- */
function safeGetLS(key) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
  catch (e) { return null; }
}
function safeSetLS(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) { return false; }
}

function loadData() {
  const seededV2 = safeGetLS(LS_SEEDED);

  if (!seededV2) {
    // Force a fresh Stripe re-seed (fixes anyone whose browser cached the older
    // data structure that predates the MD Payment field). Carry forward any
    // manual entries from the old version so nothing typed in gets lost.
    const seedEl = document.getElementById('seed-data');
    let seed = [];
    try { seed = JSON.parse(seedEl.textContent); } catch (e) { seed = []; }
    STRIPE_ROWS = normalizeStripe(seed);

    const oldManual = safeGetLS(LS_MANUAL_OLD);
    MANUAL_ROWS = Array.isArray(oldManual) ? oldManual : [];

    safeSetLS(LS_STRIPE, STRIPE_ROWS);
    safeSetLS(LS_MANUAL, MANUAL_ROWS);
    safeSetLS(LS_SEEDED, true);
  } else {
    STRIPE_ROWS = safeGetLS(LS_STRIPE) || [];
    MANUAL_ROWS = safeGetLS(LS_MANUAL) || [];
  }
}

function persistStripe() { safeSetLS(LS_STRIPE, STRIPE_ROWS); }
function persistManual() { safeSetLS(LS_MANUAL, MANUAL_ROWS); }

function normalizeStripe(rows) {
  return rows.map(r => {
    const received = (r.received === undefined || r.received === null || isNaN(r.received)) ? null : Number(r.received);
    const fee = (r.fee === undefined || r.fee === null || isNaN(r.fee)) ? null : Number(r.fee);
    const appFee = (r.appFee === undefined || r.appFee === null || isNaN(r.appFee)) ? 0 : Number(r.appFee);
    const wasPaid = !!received;
    // MD Payment = Monthly Fee (provider-facing amount) minus the Charge Application Fee
    // (the actual Moxie/PC cut taken by Stripe on this charge). Only counted if the charge was paid.
    const mdPayment = wasPaid ? Number(((fee || 0) - appFee).toFixed(2)) : 0;
    return {
      id: r.id,
      month: r.month,
      medspa: r.medspa || '',
      psm: r.psm || '',
      md: (r.md || '').trim(),
      pc: (r.pc || '').trim() || NO_PC,
      state: r.state || '',
      status: r.status || '',
      paidAt: r.paidAt || null,
      fee: fee,
      moxieFee: r.moxieFee,
      appFee: appFee,
      received: received,       // Moxie's revenue on this charge (reference only - NOT the MD's payment)
      mdPayment: mdPayment      // Actual amount owed/paid to the MD = Monthly Fee - Charge Application Fee
    };
  });
}

/* ---------------- Utility ---------------- */
function fmtMoney(n) {
  if (n === null || n === undefined || isNaN(n)) n = 0;
  const neg = n < 0;
  const v = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (neg ? '(' : '') + '$' + v + (neg ? ')' : '');
}
function yearOf(dateStr) {
  if (!dateStr) return null;
  const y = parseInt(String(dateStr).slice(0, 4), 10);
  return isNaN(y) ? null : y;
}
function uid() { return 'm_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------------- Derived data ---------------- */
function availableYears() {
  const ys = new Set();
  STRIPE_ROWS.forEach(r => { const y = yearOf(r.month); if (y) ys.add(y); });
  MANUAL_ROWS.forEach(r => { const y = yearOf(r.date); if (y) ys.add(y); });
  if (ys.size === 0) ys.add(new Date().getFullYear());
  return Array.from(ys).sort((a, b) => b - a);
}

function stripeTotalsForYear(year) {
  let total = 0, count = 0, moxieRevenue = 0;
  STRIPE_ROWS.forEach(r => {
    if (yearOf(r.month) === year && r.received) {
      total += r.mdPayment || 0;
      moxieRevenue += r.received;
      count++;
    }
  });
  return { total, count, moxieRevenue };
}

function manualTotalsForYear(year) {
  const out = { 'Manual Invoice': 0, 'OOO Payment - Interim MD': 0, 'OOO Payment - MD': 0, 'Refund / Wire Out': 0 };
  MANUAL_ROWS.forEach(r => {
    if (yearOf(r.date) === year && out.hasOwnProperty(r.type)) out[r.type] += Number(r.amount) || 0;
  });
  return out;
}

function perMdPcSummary(year) {
  const map = new Map(); // key -> row
  function keyOf(md, pc) { return md + '|||' + pc; }
  function ensure(md, pc) {
    const k = keyOf(md, pc);
    if (!map.has(k)) {
      map.set(k, { md, pc, stripe: 0, invoice: 0, oooInterim: 0, oooMd: 0, refund: 0, stripeCount: 0 });
    }
    return map.get(k);
  }
  STRIPE_ROWS.forEach(r => {
    if (!r.md) return;
    if (yearOf(r.month) !== year) return;
    if (!r.received) return;
    const row = ensure(r.md, r.pc || NO_PC);
    row.stripe += (r.mdPayment || 0);
    row.stripeCount++;
  });
  MANUAL_ROWS.forEach(r => {
    if (!r.md) return;
    if (yearOf(r.date) !== year) return;
    const row = ensure(r.md, r.pc || NO_PC);
    const amt = Number(r.amount) || 0;
    if (r.type === 'Manual Invoice') row.invoice += amt;
    else if (r.type === 'OOO Payment - Interim MD') row.oooInterim += amt;
    else if (r.type === 'OOO Payment - MD') row.oooMd += amt;
    else if (r.type === 'Refund / Wire Out') row.refund += amt;
  });
  const rows = Array.from(map.values()).map(r => ({
    ...r,
    net: r.stripe + r.invoice + r.oooInterim + r.oooMd - r.refund
  }));
  rows.sort((a, b) => a.md.localeCompare(b.md) || a.pc.localeCompare(b.pc));
  return rows;
}

function pcSummary(year) {
  const perMd = perMdPcSummary(year);
  const map = new Map();
  perMd.forEach(r => {
    if (!map.has(r.pc)) map.set(r.pc, { pc: r.pc, stripe: 0, invoice: 0, ooo: 0, refund: 0, mds: new Set() });
    const row = map.get(r.pc);
    row.stripe += r.stripe;
    row.invoice += r.invoice;
    row.ooo += r.oooInterim + r.oooMd;
    row.refund += r.refund;
    row.mds.add(r.md);
  });
  const rows = Array.from(map.values()).map(r => ({
    pc: r.pc, stripe: r.stripe, invoice: r.invoice, ooo: r.ooo, refund: r.refund,
    net: r.stripe + r.invoice + r.ooo - r.refund, mdCount: r.mds.size
  }));
  rows.sort((a, b) => b.net - a.net);
  return rows;
}

function mdOverallSummary(year) {
  const perMdPc = perMdPcSummary(year);
  const map = new Map();
  perMdPc.forEach(r => {
    if (!map.has(r.md)) {
      map.set(r.md, { md: r.md, stripe: 0, invoice: 0, oooInterim: 0, oooMd: 0, refund: 0, stripeCount: 0, pcs: new Set(), medspas: new Set() });
    }
    const row = map.get(r.md);
    row.stripe += r.stripe;
    row.invoice += r.invoice;
    row.oooInterim += r.oooInterim;
    row.oooMd += r.oooMd;
    row.refund += r.refund;
    row.stripeCount += r.stripeCount;
    row.pcs.add(r.pc);
  });
  // count distinct medspas per MD from raw stripe rows for the year
  STRIPE_ROWS.forEach(r => {
    if (!r.md || yearOf(r.month) !== year || !r.received) return;
    if (map.has(r.md)) map.get(r.md).medspas.add(r.medspa);
  });
  const rows = Array.from(map.values()).map(r => ({
    md: r.md,
    pcCount: r.pcs.size,
    medspaCount: r.medspas.size,
    stripe: r.stripe, invoice: r.invoice, oooInterim: r.oooInterim, oooMd: r.oooMd, refund: r.refund,
    net: r.stripe + r.invoice + r.oooInterim + r.oooMd - r.refund
  }));
  rows.sort((a, b) => b.net - a.net);
  return rows;
}

/* ===================== RENDERING ===================== */
function render() {
  document.querySelectorAll('.navitem').forEach(el => {
    el.classList.toggle('active', el.dataset.view === currentView);
  });
  const titles = {
    summary: ['Summary', 'Cash-basis totals for MD compensation and tax reporting'],
    mdoverall: ['MD Overall Summary', 'One row per MD — total take-home across every medspa and PC they work under'],
    permd: ['Per-MD & PC Detail', 'Stripe + manual totals broken out by Medical Director and Professional Corporation'],
    manual: ['Manual Entries', 'Log manual invoices, OOO coverage payments, and refunds / wires'],
    stripelog: ['Stripe Payment Log', 'Every MD subscription payment imported from the monthly OMNI/Stripe CSV export']
  };
  document.getElementById('topTitle').textContent = titles[currentView][0];
  document.getElementById('topSub').textContent = titles[currentView][1];

  const container = document.getElementById('views');
  if (currentView === 'summary') container.innerHTML = renderSummary();
  else if (currentView === 'mdoverall') container.innerHTML = renderMdOverall();
  else if (currentView === 'permd') container.innerHTML = renderPerMd();
  else if (currentView === 'manual') container.innerHTML = renderManual();
  else if (currentView === 'stripelog') container.innerHTML = renderStripeLog();

  attachViewHandlers();
  updateFooterStats();
}

function updateFooterStats() {
  const foot = document.getElementById('footStats');
  const years = availableYears();
  foot.innerHTML = `${STRIPE_ROWS.length.toLocaleString()} Stripe rows<br>${MANUAL_ROWS.length.toLocaleString()} manual entries<br>Data through ${years.length ? years[0] : '—'}`;
}

/* ---------- Summary view ---------- */
function renderSummary() {
  const year = currentYear;
  const { total: stripeTotal, count: stripeCount, moxieRevenue } = stripeTotalsForYear(year);
  const manual = manualTotalsForYear(year);
  const oooTotal = manual['OOO Payment - Interim MD'] + manual['OOO Payment - MD'];
  const refundTotal = manual['Refund / Wire Out'];
  const net = stripeTotal + manual['Manual Invoice'] + oooTotal - refundTotal;
  const pcRows = pcSummary(year);

  return `
    <div class="kpi-grid">

        <div class="label">MD Payment (Stripe)</div>

      <div class="kpi net"><div class="bar"></div>

        <div class="value mono">${fmtMoney(net)}</div>

      </div>
    </div>
    <div class="banner" style="margin-top:16px;">
      <span>ℹ️</span>
      <span>Reference only — Moxie's own revenue collected on these charges (Charge Application Fee, via Stripe) totaled <b>${fmtMoney(moxieRevenue)}</b> for ${year}. This is Moxie's cut, not MD income, and is not part of any total above.</span>
    </div>

    <div class="section-title">By Professional Corporation</div>
    <div class="panel">
      <div class="panel-head">
        <div>
          <h3>Professional Corporation rollup</h3>
          <div class="hint">Sum of every MD under each PC for ${year}</div>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th>Professional Corporation</th>

            <th class="num">Net Total</th>
          </tr></thead>
          <tbody>
            ${pcRows.length === 0 ? `<tr class="empty-row"><td colspan="7">No data for ${year} yet</td></tr>` :
              pcRows.map(r => `
                <tr>
                  <td>${escapeHtml(r.pc)}</td>
                  <td class="num mono">${r.mdCount}</td>
                  <td class="num mono">${fmtMoney(r.stripe)}</td>
                  <td class="num mono">${fmtMoney(r.invoice)}</td>
                  <td class="num mono">${fmtMoney(r.ooo)}</td>
                  <td class="num mono ${r.refund ? 'neg' : ''}">${r.refund ? '-' + fmtMoney(r.refund) : fmtMoney(0)}</td>
                  <td class="num mono"><b>${fmtMoney(r.net)}</b></td>
                </tr>`).join('')
            }
          </tbody>
        </table>
      </div>

  `;
}

/* ---------- MD Overall Summary view ---------- */
function renderMdOverall() {
  const rows = mdOverallSummary(currentYear);
  window._mdoverallRowsCache = rows;
  return `
    <div class="panel">
      <div class="panel-head">
        <div>
          <h3>MD Overall Summary — ${currentYear}</h3>
          <div class="hint">${rows.length} MDs with activity this year — total take-home across every medspa and PC</div>
        </div>
        <div class="search">
          <span>&#128269;</span>

        </div>
      </div>
      <div class="table-scroll">
        <table id="mdoverallTable">

/* ===================== EVENT HANDLERS ===================== */
function attachViewHandlers() {
  if (currentView === 'mdoverall') {
    renderMdOverallBody('');
    document.getElementById('mdoverallSearch').addEventListener('input', e => renderMdOverallBody(e.target.value));
    document.querySelectorAll('#mdoverallTable thead th[data-key]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        const cur = sortState.mdoverall;
        const dir = (cur && cur.key === key && cur.dir === 'asc') ? 'desc' : 'asc';
        sortState.mdoverall = { key, dir };
        renderMdOverallBody(document.getElementById('mdoverallSearch').value);
      });
    });
  } else if (currentView === 'permd') {
    renderPerMdBody('');
    document.getElementById('permdSearch').addEventListener('input', e => renderPerMdBody(e.target.value));
    document.querySelectorAll('#permdTable thead th[data-key]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        const cur = sortState.permd;
        const dir = (cur && cur.key === key && cur.dir === 'asc') ? 'desc' : 'asc';
        sortState.permd = { key, dir };
        renderPerMdBody(document.getElementById('permdSearch').value);
      });
    });
  } else if (currentView === 'manual') {
    renderManualBody('');
    document.getElementById('manualSearch').addEventListener('input', e => renderManualBody(e.target.value));
    document.getElementById('manualForm').addEventListener('submit', onAddManualEntry);
    document.getElementById('manualBody').addEventListener('click', e => {
      if (e.target.classList.contains('delete-manual')) {
        confirmDelete(e.target.dataset.id);
      }
    });
  } else if (currentView === 'stripelog') {
    renderStripeBody('');
    document.getElementById('stripeSearch').addEventListener('input', e => renderStripeBody(e.target.value));
  }
}

function onAddManualEntry(e) {
  e.preventDefault();
  const date = document.getElementById('f_date').value;
  const type = document.getElementById('f_type').value;
  const amount = parseFloat(document.getElementById('f_amount').value);
  const md = document.getElementById('f_md').value.trim();
  const msg = document.getElementById('formMsg');

  if (!date || !type || !md || isNaN(amount) || amount <= 0) {
    msg.textContent = 'Date, type, MD name, and a positive amount are required.';
    msg.className = 'form-msg err';
    return;
  }

  const entry = {
    id: uid(),
    date,
    type,
    amount,
    md,
    pc: document.getElementById('f_pc').value.trim() || NO_PC,
    medspa: document.getElementById('f_medspa').value.trim(),
    method: document.getElementById('f_method').value,
    notes: document.getElementById('f_notes').value.trim()
  };
  MANUAL_ROWS.push(entry);
  persistManual();

  const enteredYear = yearOf(date);
  if (enteredYear !== currentYear) {
    currentYear = enteredYear;
    populateYearSelect();
  }
  showToast(`${type} of ${fmtMoney(amount)} added for ${md}`);
  document.getElementById('manualForm').reset();
  msg.textContent = '';
  render();
}

let pendingDeleteId = null;
function confirmDelete(id) {
  pendingDeleteId = id;
  const entry = MANUAL_ROWS.find(r => r.id === id);
  document.getElementById('modalTitle').textContent = 'Delete this entry?';
  document.getElementById('modalBody').textContent = entry
    ? `${entry.type} of ${fmtMoney(entry.amount)} for ${entry.md} on ${entry.date}. This can't be undone.`
    : `This can't be undone.`;
  document.getElementById('modalOverlay').classList.add('show');
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('modalCancel').addEventListener('click', () => {
    document.getElementById('modalOverlay').classList.remove('show');
    pendingDeleteId = null;
  });
  document.getElementById('modalConfirm').addEventListener('click', () => {
    if (pendingDeleteId) {
      MANUAL_ROWS = MANUAL_ROWS.filter(r => r.id !== pendingDeleteId);
      persistManual();
      showToast('Entry deleted');
      render();
    }
    document.getElementById('modalOverlay').classList.remove('show');
    pendingDeleteId = null;
  });
});

/* ---------------- CSV Import ---------------- */
const CSV_FIELD_MAP = {
  'Medspa Name': 'medspa',
  'PSM Name': 'psm',
  'Medical Director(s), Non-GFE Reviewer(s)': 'md',
  'Professional Corporation Name': 'pc',
  'State': 'state',
  'Subscription Status': 'status',
  'Month Date': 'month',
  'Invoice ID': 'id',
  'Paid At Date': 'paidAt',
  'Monthly Fee': 'fee',
  'Moxie Fee': 'moxieFee',
  'Charge Application Fee': 'appFee',
  'Amount Received': 'received'
};

function handleCsvImport(file) {
  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: function (results) {
      try {
        const raw = results.data;
        let added = 0, updated = 0;
        const byId = new Map(STRIPE_ROWS.map(r => [r.id, r]));
        raw.forEach(row => {
          const rec = {};
          Object.keys(CSV_FIELD_MAP).forEach(csvKey => {
            rec[CSV_FIELD_MAP[csvKey]] = row[csvKey];
          });
          if (!rec.medspa && !rec.md) return; // skip blank rows
          rec.id = rec.id || `${rec.medspa}|${rec.month}`;
          ['fee', 'moxieFee', 'appFee', 'received'].forEach(f => {
            const n = parseFloat(rec[f]);
            rec[f] = isNaN(n) ? null : n;
          });
          const normalized = normalizeStripe([rec])[0];
          if (byId.has(normalized.id)) updated++; else added++;
          byId.set(normalized.id, normalized);
        });
        STRIPE_ROWS = Array.from(byId.values());
        persistStripe();
        populateYearSelect();
        showImportBanner(`Imported ${raw.length.toLocaleString()} rows from CSV — ${added.toLocaleString()} new, ${updated.toLocaleString()} updated existing entries.`);
        render();
      } catch (err) {
        showImportBanner('Could not read that file — make sure it\'s the standard MD Subscriptions CSV export.', true);
      }
    },
    error: function () {
      showImportBanner('Could not read that file — make sure it\'s a valid CSV export.', true);
    }
  });
}

function showImportBanner(text, isError) {
  const el = document.getElementById('importBanner');
  el.innerHTML = `<span>${isError ? '⚠️' : '✅'}</span><span>${text}</span>`;
  el.classList.remove('hide');
  el.style.background = isError ? '#FBEAE9' : '';
  el.style.borderColor = isError ? '#E8B9B6' : '';
  el.style.color = isError ? '#7A1F1A' : '';
  clearTimeout(showImportBanner._t);
  showImportBanner._t = setTimeout(() => el.classList.add('hide'), 8000);
}

/* ---------------- Backup export/import ---------------- */
function exportBackup() {
  const payload = { exportedAt: new Date().toISOString(), stripe: STRIPE_ROWS, manual: MANUAL_ROWS };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `md-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup file downloaded');
}

function handleBackupImport(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const payload = JSON.parse(reader.result);
      if (!payload.stripe || !payload.manual) throw new Error('bad shape');
      STRIPE_ROWS = normalizeStripe(payload.stripe);
      MANUAL_ROWS = payload.manual;
      persistStripe(); persistManual();
      populateYearSelect();
      showImportBanner(`Restored backup from ${new Date(payload.exportedAt).toLocaleString()} — ${STRIPE_ROWS.length.toLocaleString()} Stripe rows, ${MANUAL_ROWS.length.toLocaleString()} manual entries.`);
      render();
    } catch (e) {
      showImportBanner('That file doesn\'t look like a valid backup export.', true);
    }
  };
  reader.readAsText(file);
}

  const prev = currentYear;
  sel.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
  currentYear = years.includes(prev) ? prev : years[0];
  sel.value = currentYear;
}

function init() {
  loadData();
  populateYearSelect();
  render();

  document.querySelectorAll('.navitem').forEach(el => {
    el.addEventListener('click', () => { currentView = el.dataset.view; render(); });
  });
  document.getElementById('yearSelect').addEventListener('change', e => {
    currentYear = parseInt(e.target.value, 10);
    render();
  });
  document.getElementById('btnExport').addEventListener('click', exportBackup);
  document.getElementById('btnImportBackup').addEventListener('click', () => document.getElementById('fileImportBackup').click());
  document.getElementById('fileImportBackup').addEventListener('change', e => {
    if (e.target.files[0]) handleBackupImport(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('btnImportCsv').addEventListener('click', () => document.getElementById('fileImportCsv').click());
  document.getElementById('fileImportCsv').addEventListener('change', e => {
    if (e.target.files[0]) handleCsvImport(e.target.files[0]);
    e.target.value = '';
  });
}

init();

</script>
</body>
</html>
